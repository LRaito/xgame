<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>游戏</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            color: #e2e8f0;
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            overflow: hidden;
        }
        /* #status 作为不透明全屏层盖住引擎容器；等 start() 成功后再隐藏。
           不能反过来用 display:none 藏 #ejs：EmulatorJS 构造时会重写容器内联样式
           （写入 --ejs-* 变量），会把我们设的 display:block 抹掉，导致引擎界面永远隐藏。 */
        #status {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-size: 15px;
            background: #000;
        }
        #status.error {
            color: #fca5a5;
        }
        #ejs {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        /* 父页面在全屏闲置时给 <html> 挂这个类，让 iframe 内的光标一起隐藏。
           必须 !important：引擎样式里 .ejs_game 等把 cursor 设成了 default/pointer。 */
        html.x-cursor-hidden,
        html.x-cursor-hidden * {
            cursor: none !important;
        }
        /* NDS：画布只保留两块屏幕（遮罩在 applyNdsMask 里写），其余区域透明，
           露出父页面盖在 iframe 后面的机壳。透明链路必须从文档根一路打通到引擎容器；
           #status、菜单栏、设置下拉、弹层保持原样——它们要在机壳之上。
           这个类在 EJS_onGameStart 之后才挂，加载阶段的 UI 仍然压在黑底上。 */
        html.x-nds-passthrough,
        html.x-nds-passthrough body,
        html.x-nds-passthrough #ejs,
        html.x-nds-passthrough #ejs .ejs_parent,
        html.x-nds-passthrough #ejs .ejs_game,
        html.x-nds-passthrough #ejs .ejs_canvas_parent,
        html.x-nds-passthrough #ejs .ejs_game_background,
        html.x-nds-passthrough #ejs .ejs_game_background_blur::before,
        html.x-nds-passthrough #ejs .ejs_game_background_blur::after {
            background: transparent !important;
            background-image: none !important;
        }
        /* 右上角那个三横线“菜单栏开关”是引擎的 .ejs_virtualGamepad_open（即
           menu-bar-button），在触屏/设置了“可见”时会常驻挡画面，直接隐藏。 */
        .ejs_virtualGamepad_open {
            display: none !important;
        }
        /* 接管底部控制条的显隐（引擎默认的自动收起时机太拖）：只用一个开关类控制，
           用 !important 盖住引擎自己加的显隐样式。默认隐藏，由 JS 按“底部悬停/点按切换”显示。 */
        #ejs .ejs_menu_bar {
            transition: transform 0.16s ease, opacity 0.16s ease !important;
        }
        #ejs .ejs_menu_bar.x-ctrl-hide {
            opacity: 0 !important;
            transform: translateY(120%) !important;
            pointer-events: none !important;
        }
        #ejs .ejs_menu_bar.x-ctrl-show {
            opacity: 1 !important;
            transform: none !important;
            pointer-events: auto !important;
        }
        #ejs .ejs_small_screen .ejs_menu_bar.x-ctrl-show {
            transform: translate(-50%, 0) !important;
        }
        #ejs .ejs_small_screen .ejs_menu_bar.x-ctrl-hide {
            transform: translate(-50%, 130%) !important;
        }
    </style>
</head>
<body>
    <div id="status">正在准备模拟器…</div>
    <div id="ejs"></div>

    <script>
        // EmulatorJS 官方要求 SPA 内用 iframe 隔离运行，本页即为那个独立播放文档：
        // 把 query 参数翻译成 EJS_* 全局并挂 loader.js，并在引擎就绪后暴露 __ejsRpc，
        // 供父页面做“整体即时存档”的捕捉/放回（云存档的基础原语）与画面截图。
        // 引擎在 loader 尾部会把实例暴露到 window.EJS_emulator（含 elements/storage/gameManager），
        // 同源 iframe 内可直接使用，无需猜测 DOM 选择器。

        (() => {
            /** 父页面传来的内核选项串（`k=v,k=v`）→ `{k: v}`；不合规的片段丢掉，不因它整个崩。 */
            function parseFilterOptions(raw) {
                const options = {};
                for (const pair of String(raw || "").split(",")) {
                    const index = pair.indexOf("=");
                    if (index <= 0) {
                        continue;
                    }
                    options[pair.slice(0, index)] = pair.slice(index + 1);
                }
                return options;
            }

            const params = new URLSearchParams(location.search);
            const id = params.get("id");
            const core = params.get("core");
            const name = params.get("name") || "";
            const version = params.get("v") || "";
            // 显示比例（父页面「窗口」选择器里选的那一列）：wide = 4:3，其余 = 像素完美 PP
            const wide = params.get("ratio") === "wide";
            // 复古滤镜：内核选项（`k=v,k=v`，内核加载前写进内核设置文件）与着色器键名
            // （引擎起来后启用）。两者都由父页面标题栏的滤镜选择器给出，这里是唯一落地点。
            const filterOptions = parseFilterOptions(params.get("copts"));
            const filterShader = params.get("shader") || "";

            // NDS BIOS：用户自备的静态包（zip 根目录放 bios7.bin / bios9.bin / firmware.bin），
            // 不进 git；/emulatorjs/ 整体 immutable，bios/ 单独 no-cache（见 nginx 与 static_site.py）。
            const NDS_BIOS_URL = "/emulatorjs/bios/nds.zip";
            // NDS 三种屏幕布局（父页面 - / = 循环切换，模式经 ?nds= 传进来）。
            // 与 frontend/src/constants/emulatorScreens.js 的 NDS_NATIVE 一一对应，必须同步：
            //   dual = 上下双屏 + gap 54（帧缓冲 256×438）
            //   top  = 只显示上屏（256×192），gap 无意义
            //   side = 左右双屏。melonDS 的 Left/Right 布局**不使用 melonds_screen_gap**，
            //          帧缓冲始终 512×192（两屏紧贴）；而左右机壳的两个洞之间是机身，
            //          所以由宿主页把 512×192 拆成左右两屏、中间插入 51px 透明间隙
            //          （见 setupNdsSideScreen），对外按 (256+51+256)×192 = 563×192 上报。
            //          51 由 nds-side-shell.png 的洞口反推：92×256/460 ≈ 51.2，取 51。
            const NDS_SIDE_GAP = 51;
            const NDS_SIDE_SCREEN = { width: 256, height: 192 };
            const NDS_LAYOUTS = {
                dual: { layout: "Top/Bottom", gap: "54" },
                top: { layout: "Top Only", gap: "54" },
                // gap 对 Left/Right 无效（内核忽略），真正的间隙由合成层控制
                side: { layout: "Left/Right", gap: "0" },
            };
            const ndsParam = params.get("nds");
            let ndsMode = NDS_LAYOUTS[ndsParam] ? ndsParam : "dual";

            const statusEl = document.getElementById("status");

            function showError(message) {
                statusEl.style.display = ""; // 若已被 start() 隐藏，则重新显示错误层
                statusEl.className = "error";
                statusEl.textContent = message;
            }

            if (!id || !core) {
                showError("缺少游戏参数，请从游戏中心进入。");
                return;
            }

            // ---------- 存档 RPC：父页面经 iframe.contentWindow.__ejsRpc 调用 ----------
            window.__ejsReady = false;

            function wait(ms) {
                return new Promise((resolve) => window.setTimeout(resolve, ms));
            }

            function bytesToBase64(bytes) {
                const chunk = 0x8000;
                let binary = "";
                for (let i = 0; i < bytes.length; i += chunk) {
                    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
                }
                return btoa(binary);
            }

            function base64ToUint8(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i += 1) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes;
            }

            // 还原引擎存储里的值到字节：存储的是 Uint8Array，个别内核可能是 {data} 包装
            function normalizeBytes(value) {
                if (!value) return null;
                if (value instanceof Uint8Array) return value;
                if (value instanceof ArrayBuffer) return new Uint8Array(value);
                if (value.data instanceof Uint8Array) return value.data;
                if (value.data instanceof ArrayBuffer) return new Uint8Array(value.data);
                if (ArrayBuffer.isView(value)) return new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
                return null;
            }

            // 引擎“浏览器即时存档”的单键：与引擎内部 Save State 的写入键一致
            function stateKey() {
                const inst = window.EJS_emulator;
                if (!inst || typeof inst.getBaseFileName !== "function") return null;
                return inst.getBaseFileName() + ".state";
            }

            /**
             * 把引擎画布的原生像素拷进一张新画布并编码为 PNG。引擎画布可能是 WebGL 的
             * （绘制缓冲在合成后即失效），所以和引擎自带的截图实现一样放进 requestAnimationFrame：
             * 同一帧里引擎先渲染、我们再拷，拿到的才是当前这帧而不是空白。
             */
            function captureCanvas(source) {
                return new Promise((resolve) => {
                    requestAnimationFrame(() => {
                        try {
                            const out = document.createElement("canvas");
                            out.width = source.width;
                            out.height = source.height;
                            const ctx = out.getContext("2d", { alpha: false });
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(source, 0, 0);
                            out.toBlob(resolve, "image/png");
                        } catch {
                            resolve(null);
                        }
                    });
                });
            }

            /**
             * 引擎自带截图（内核侧读帧缓冲）：{ bytes, width, height }，不可用则 null。
             * 拿到的是 PNG 字节，尺寸从 IHDR 里读，免得再猜一遍。
             */
            async function captureCoreFrame(inst) {
                const manager = inst.gameManager;
                if (!manager || typeof manager.screenshot !== "function") {
                    return null;
                }
                try {
                    const bytes = new Uint8Array(await manager.screenshot());
                    const size = pngSize(bytes);
                    if (!bytes.length || !size) {
                        return null;
                    }
                    return { bytes, width: size.width, height: size.height };
                } catch {
                    return null;
                }
            }

            /** 拷画布（显示尺寸）：{ bytes, width, height }，不可用则 null */
            async function captureCanvasFrame(inst) {
                const canvas = inst.canvas;
                if (!canvas || !canvas.width || !canvas.height) {
                    return null;
                }
                const blob = await captureCanvas(canvas);
                if (!blob) {
                    return null;
                }
                return {
                    bytes: new Uint8Array(await blob.arrayBuffer()),
                    width: canvas.width,
                    height: canvas.height,
                };
            }

            /** 从 PNG 字节读 IHDR 里的宽高；不是 PNG 就返回 null（当作这条路不可用） */
            /** { bytes, width, height } → __ejsRpc.screenshot 的返回结构 */
            function toShot(frame) {
                return {
                    ok: true,
                    base64: bytesToBase64(frame.bytes),
                    width: frame.width,
                    height: frame.height,
                };
            }

            function pngSize(bytes) {
                const signature = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
                if (bytes.length < 24 || signature.some((byte, i) => bytes[i] !== byte)) {
                    return null;
                }
                const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
                return { width: view.getUint32(16), height: view.getUint32(20) };
            }

            /** 整幅全黑？（抽样判定）用来识别某条截图路踩空了——比如 WebGL 绘制缓冲已被清掉 */
            async function isBlankFrame(frame) {
                try {
                    const bitmap = await createImageBitmap(new Blob([frame.bytes], { type: "image/png" }));
                    const canvas = document.createElement("canvas");
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    const ctx = canvas.getContext("2d", { alpha: false });
                    ctx.drawImage(bitmap, 0, 0);
                    bitmap.close?.();
                    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    for (let i = 0; i < data.length; i += 4 * 7) {
                        if (data[i] > 8 || data[i + 1] > 8 || data[i + 2] > 8) {
                            return false;
                        }
                    }
                    return true;
                } catch {
                    return false; // 判不出来就当它不黑，免得把好图丢掉
                }
            }

            // ---------- NDS 屏幕遮罩 ----------
            // 把引擎主画布按内核**实际**帧缓冲几何遮成屏幕区域：被遮掉的部分透明，
            // 露出父页面放在 iframe 后面的机壳（铰链 / 边框）。只动主画布，不动菜单与弹层
            // ——设置下拉、菜单栏、右键菜单都是 iframe 内的 HTML，自然在机壳之上。
            //   dual：竖直方向保留上下各 192 行（高 h，中间间隙 = h-384）；
            //   side：水平方向保留左右各 256 列（宽 w，中间间隙 = w-512）；
            //   top / 尺寸不含间隙：不遮（画布全是上屏）。
            function readVideoSize(manager) {
                try {
                    const width = Number(manager?.getVideoDimensions("width"));
                    const height = Number(manager?.getVideoDimensions("height"));
                    if (!(width > 0) || !(height > 0)) {
                        return null;
                    }
                    return { width, height };
                } catch {
                    return null;
                }
            }

            function maskImageFor(mode, size) {
                if (!size) {
                    return "";
                }
                const { width, height } = size;
                if (mode === "dual" && height > 384) {
                    const a = (192 / height) * 100;
                    const b = ((height - 192) / height) * 100;
                    return `linear-gradient(to bottom, #000 0 ${a}%, transparent ${a}% ${b}%, #000 ${b}% 100%)`;
                }
                if (mode === "side" && width > 512) {
                    const a = (256 / width) * 100;
                    const b = ((width - 256) / width) * 100;
                    return `linear-gradient(to right, #000 0 ${a}%, transparent ${a}% ${b}%, #000 ${b}% 100%)`;
                }
                return "";
            }

            /** 按当前模式重算画布遮罩；值没变也重写（属性很便宜，省掉比较的边界情况）。 */
            function applyNdsMask() {
                if (core !== "nds") {
                    return;
                }
                const inst = window.EJS_emulator;
                const canvas = inst?.canvas || document.querySelector("#ejs canvas.ejs_canvas");
                if (!canvas) {
                    return;
                }
                const mask = maskImageFor(ndsMode, readVideoSize(inst?.gameManager));
                canvas.style.webkitMaskImage = mask;
                canvas.style.maskImage = mask;
                canvas.style.maskRepeat = "no-repeat";
                canvas.style.webkitMaskRepeat = "no-repeat";
                canvas.style.maskSize = "100% 100%";
                canvas.style.webkitMaskSize = "100% 100%";
            }

            // ---------- NDS 左右布局：拆屏 + 插入间隙 ----------
            // 内核的 Left/Right 布局没有水平间隙（帧缓冲 512×192，两屏紧贴），而左右机壳
            // 的两个洞之间是机身。这里把引擎画布里的左右两屏分别抠出来，按 0..256 与
            // 307..563 摆到一张 563×192 的合成画布上，中间 51px 留透明——父页面盖在
            // iframe 后面的机壳就从缝里露出来，两块画面各自落在自己的洞里。
            // 原画布设 opacity:0 继续渲染并接收输入；合成层 pointer-events:none 把事件让给它。
            let ndsSideScreen = null;

            function removeNdsSideScreen() {
                if (!ndsSideScreen) {
                    return;
                }
                cancelAnimationFrame(ndsSideScreen.raf);
                ndsSideScreen.canvas.remove();
                if (ndsSideScreen.src) {
                    ndsSideScreen.src.style.opacity = "";
                }
                ndsSideScreen = null;
            }

            function setupNdsSideScreen() {
                removeNdsSideScreen();
                if (core !== "nds" || ndsMode !== "side") {
                    return;
                }
                const inst = window.EJS_emulator;
                const src = inst?.canvas || document.querySelector("#ejs canvas.ejs_canvas");
                if (!src) {
                    return;
                }
                const gap = NDS_SIDE_GAP;
                const sw = NDS_SIDE_SCREEN.width;
                const sh = NDS_SIDE_SCREEN.height;
                const canvas = document.createElement("canvas");
                canvas.width = sw * 2 + gap;
                canvas.height = sh;
                canvas.style.cssText =
                    "position:fixed;z-index:5;pointer-events:none;image-rendering:pixelated";
                const ctx = canvas.getContext("2d");
                // 引擎是像素画风，放大时保持硬边
                ctx.imageSmoothingEnabled = false;
                src.style.opacity = "0";
                document.body.appendChild(canvas);
                const draw = () => {
                    const rect = src.getBoundingClientRect();
                    canvas.style.left = `${rect.left}px`;
                    canvas.style.top = `${rect.top}px`;
                    canvas.style.width = `${rect.width}px`;
                    canvas.style.height = `${rect.height}px`;
                    const w = src.width;
                    const h = src.height;
                    if (w > 0 && h > 0) {
                        // 引擎把 512×192 的帧按等比居中摆进画布，两侧可能有黑边；
                        // 先算帧区域，只取两屏，不把黑边带进合成层。
                        const scale = Math.min(w / (sw * 2), h / sh);
                        const frameW = sw * 2 * scale;
                        const frameH = sh * scale;
                        const ox = (w - frameW) / 2;
                        const oy = (h - frameH) / 2;
                        // 合成画布按源画布的像素密度取尺寸，避免把高倍率画面压成 256px
                        const cw = Math.round(frameW) + Math.round(gap * scale);
                        const ch = Math.round(frameH);
                        if (canvas.width !== cw || canvas.height !== ch) {
                            canvas.width = cw;
                            canvas.height = ch;
                            ctx.imageSmoothingEnabled = false;
                        }
                        const halfW = Math.round(frameW / 2);
                        const halfH = ch;
                        ctx.clearRect(0, 0, cw, ch);
                        ctx.drawImage(src, ox, oy, frameW / 2, frameH, 0, 0, halfW, halfH);
                        ctx.drawImage(
                            src,
                            ox + frameW / 2,
                            oy,
                            frameW / 2,
                            frameH,
                            halfW + Math.round(gap * scale),
                            0,
                            halfW,
                            halfH,
                        );
                    }
                    if (ndsSideScreen && ndsSideScreen.canvas === canvas) {
                        ndsSideScreen.raf = requestAnimationFrame(draw);
                    }
                };
                ndsSideScreen = { canvas, src, raf: 0 };
                draw();
            }

            /** 把布局/间隙写进引擎内核变量（运行中改与引擎设置菜单走同一条路）。 */
            function applyNdsLayoutVariables(mode) {
                const conf = NDS_LAYOUTS[mode];
                const manager = window.EJS_emulator?.gameManager;
                if (!conf || typeof manager?.setVariable !== "function") {
                    return false;
                }
                manager.setVariable("melonds_screen_layout", conf.layout);
                manager.setVariable("melonds_screen_gap", conf.gap);
                return true;
            }

            /** 引擎上报的几何是否已经是目标模式的特征尺寸（留 1px 容差，别被小数卡住）。 */
            function matchesNdsMode(mode, size) {
                if (!size) {
                    return false;
                }
                const { width, height } = size;
                const near = (value, target) => Math.abs(value - target) <= 1;
                if (mode === "top") {
                    return near(width, 256) && near(height, 192);
                }
                if (mode === "side") {
                    return near(height, 192) && width > 256;
                }
                if (mode === "dual") {
                    return near(width, 256) && height > 192;
                }
                return false;
            }

            /**
             * 启用/关闭引擎内置着色器（滤镜里 CRT 那一类）。引擎自带的设置菜单走的就是这个方法：
             * 把着色器预设写进 /shader 再让内核打开着色器管线。name 为空即关掉，返回是否调用成功。
             */
            function applyShader(name) {
                const inst = window.EJS_emulator;
                if (!inst || typeof inst.enableShader !== "function") {
                    return false;
                }
                const value = name || "disabled";
                try {
                    inst.enableShader(value);
                    // 同步引擎内存里的设置项：引擎之后任何一次 saveSettings（调音量、改按键、
                    // 改菜单选项）都会把 this.settings 写回设置块；不同步的话旧着色器会覆盖
                    // 父页面刚写入的本局选择，选择器下一秒又被同步回旧值。
                    if (inst.settings) {
                        inst.settings.shader = value;
                    }
                    if (inst.allSettings) {
                        inst.allSettings.shader = value;
                    }
                    return true;
                } catch {
                    return false;
                }
            }

            window.__ejsRpc = {
                get ready() {
                    return window.__ejsReady === true && Boolean(window.EJS_emulator);
                },

                /**
                 * 引擎当前的画面几何：帧缓冲分辨率 + 内核上报的显示宽高比。父页面按 aspect
                 * 定舞台长宽比——引擎是**按 aspect 等比摆放画面**的，画布填不满的地方就是黑边，
                 * 而 aspect 不等于帧缓冲宽高比：FC 在这里被设成像素完美（PP），256 × 224 的帧缓冲
                 * 按 8:7 摆放；换成 8:7 PAR / 4:3 这类按像素宽高比校正的取值，同一个帧缓冲摆出来
                 * 的比例就不同（stageAspect 会跟着引擎上报的值变）。
                 */
                get videoInfo() {
                    const inst = window.EJS_emulator;
                    const manager = inst && inst.gameManager;
                    if (!inst || !inst.started || !manager) {
                        return null;
                    }
                    const positive = (value) =>
                        typeof value === "number" && isFinite(value) && value > 0 ? value : null;
                    try {
                        let width = positive(manager.getVideoDimensions("width"));
                        let height = positive(manager.getVideoDimensions("height"));
                        let aspect = positive(manager.getVideoDimensions("aspect"));
                        // 左右布局由宿主页合成两屏 + 间隙，对父页面按合成后的 563×192 上报，
                        // 舞台、机壳与遮罩才按「两块分开的屏」计算。
                        if (core === "nds" && ndsMode === "side" && width && height) {
                            width = NDS_SIDE_SCREEN.width * 2 + NDS_SIDE_GAP;
                            aspect = width / height;
                        }
                        return { width, height, aspect };
                    } catch {
                        return null;
                    }
                },

                /**
                 * 当前是否在持续加速：读引擎自己的标志（用户在引擎设置菜单里把 Fast Forward
                 * 改成 Enabled 也认），未开始游戏时返回 null。
                 */
                get fastForward() {
                    const inst = window.EJS_emulator;
                    if (!inst || !inst.started) {
                        return null;
                    }
                    return inst.isFastForward === true;
                },

                /**
                 * 持续加速开关（父页面标题栏的「加速模式」）。走引擎自己的「Fast Forward」
                 * 设置项——与设置菜单里那一项是同一份状态：changeSettingOption 会设好
                 * settings/allSettings，再经设置行的监听触发 menuOptionChanged →
                 * handleSpecialOptions，把 isFastForward 与 toggle_fastforward 一起改掉，
                 * 同时刷新菜单里的单选高亮并 saveSettings()，所以点过「保存配置」后能随账号同步。
                 *
                 * 刻意不直接调 gameManager.toggleFastForward：那样 isFastForward 不同步，
                 * 状态读不回来，引擎自带的快进快捷键也会把状态带乱。也刻意不碰 controls /
                 * 不拦 keydown——加速模式关着时用户自己绑的快进键行为必须与改动前一致。
                 */
                async setFastForward(on) {
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再切换加速模式。" };
                    }
                    if (typeof inst.changeSettingOption !== "function") {
                        return { ok: false, message: "当前内核不支持加速。" };
                    }
                    const value = on ? "enabled" : "disabled";
                    try {
                        inst.changeSettingOption("fastForward", value);
                        // 设置行被 hideSettings 隐藏时监听不会注册，changeSettingOption 就只写值
                        // 不生效；这里补一次直接派发，保证速度一定跟着变（settings 上面已写好）。
                        if ((inst.isFastForward === true) !== Boolean(on)) {
                            inst.menuOptionChanged("fastForward", value);
                        }
                    } catch {
                        return { ok: false, message: "切换加速模式失败。" };
                    }
                    return { ok: true, fastForward: inst.isFastForward === true };
                },

                /** 捕捉“当前进度”：触发引擎把状态写入浏览器档，读回字节 → base64 */
                async capture() {
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再备份存档。" };
                    }
                    const btn = inst.elements?.bottomBar?.saveState?.[0];
                    if (!btn) {
                        return { ok: false, message: "当前内核不支持即时存档。" };
                    }
                    btn.click(); // save-state-location=browser → 引擎写入浏览器档
                    // 等待引擎异步落库（写 IndexedDB），不足则轮询重试
                    const key = stateKey();
                    if (!key) {
                        return { ok: false, message: "无法定位引擎存档键。" };
                    }
                    let stored = null;
                    for (let i = 0; i < 8; i += 1) {
                        await wait(120);
                        try {
                            stored = await inst.storage.states.get(key);
                        } catch {
                            stored = null;
                        }
                        if (stored) break;
                    }
                    const bytes = normalizeBytes(stored);
                    if (!bytes || !bytes.length) {
                        return { ok: false, message: "存档写入失败，请重试。" };
                    }
                    return {
                        ok: true,
                        base64: bytesToBase64(bytes),
                        size: bytes.length,
                        createdAt: Date.now(),
                    };
                },

                /** 放回/载入：把整包存档字节写入引擎浏览器档并触发读档 */
                async load(base64) {
                    if (!base64) {
                        return { ok: false, message: "存档内容为空。" };
                    }
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再载入存档。" };
                    }
                    const key = stateKey();
                    if (!key) {
                        return { ok: false, message: "无法定位引擎存档键。" };
                    }
                    try {
                        await inst.storage.states.put(key, base64ToUint8(base64));
                    } catch {
                        return { ok: false, message: "写入引擎存档失败。" };
                    }
                    const btn = inst.elements?.bottomBar?.loadState?.[0];
                    if (btn) {
                        btn.click();
                    } else if (inst.gameManager && typeof inst.gameManager.loadState === "function") {
                        inst.gameManager.loadState(base64ToUint8(base64));
                    } else {
                        return { ok: false, message: "当前内核不支持载入即时存档。" };
                    }
                    return { ok: true };
                },

                /**
                 * 切显示比例模式（FC 用）：父页面「窗口」选择器里点另一列时调用，mode 是父页面的
                 * 模式名（pp / wide），这里翻译成 fceumm 的内核选项：
                 *   pp   → fceumm_aspect = PP、上下过扫描各裁 8 行（帧缓冲 256×224，显示 8:7）；
                 *   wide → fceumm_aspect = 4:3、不裁过扫描（帧缓冲 256×240，显示 4:3，铺满电视屏）。
                 * 引擎只在启动时读一次设置文件，所以运行中改只能这样直接改内核变量（与引擎设置
                 * 菜单里改选项走的是同一条路）；fceumm 会立刻按新几何重新摆放画面，父页面每秒读
                 * 一次 videoInfo 跟着重算舞台。
                 */
                async setDisplayMode(mode) {
                    if (mode !== "pp" && mode !== "wide") {
                        return { ok: false, message: "不支持的显示比例。" };
                    }
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再切换显示比例。" };
                    }
                    const toWide = mode === "wide";
                    try {
                        inst.gameManager.setVariable("fceumm_aspect", toWide ? "4:3" : "PP");
                        inst.gameManager.setVariable("fceumm_overscan_v_top", toWide ? "0" : "8");
                        inst.gameManager.setVariable("fceumm_overscan_v_bottom", toWide ? "0" : "8");
                    } catch {
                        return { ok: false, message: "切换显示比例失败。" };
                    }
                    return { ok: true };
                },

                /** 当前 NDS 屏幕布局（非 NDS 返回 null），供父页面/调试读取。 */
                get ndsMode() {
                    return core === "nds" ? ndsMode : null;
                },

                /**
                 * 切 NDS 屏幕布局（父页面 - / = 循环）：dual → top → side。
                 * 改内核变量后轮询最多 2 秒，等引擎真的上报目标几何才返回成功并重算遮罩；
                 * 超时就恢复原布局、返回 needsRestart——父页面**不重启内核**（会丢当前进度），
                 * 只提示「重新进入游戏后生效」。
                 */
                async setNdsLayout(mode) {
                    if (core !== "nds" || !NDS_LAYOUTS[mode]) {
                        return { ok: false, message: "不支持的屏幕布局。" };
                    }
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再切换屏幕布局。" };
                    }
                    if (mode === ndsMode) {
                        applyNdsMask();
                        setupNdsSideScreen();
                        return { ok: true, mode, videoInfo: window.__ejsRpc.videoInfo };
                    }
                    const previous = ndsMode;
                    try {
                        applyNdsLayoutVariables(mode);
                    } catch {
                        return { ok: false, message: "切换屏幕布局失败。" };
                    }
                    for (let i = 0; i < 40; i += 1) {
                        await wait(50);
                        if (matchesNdsMode(mode, readVideoSize(inst.gameManager))) {
                            ndsMode = mode;
                            applyNdsMask();
                            setupNdsSideScreen();
                            return { ok: true, mode, videoInfo: window.__ejsRpc.videoInfo };
                        }
                    }
                    // 引擎没有即时响应：恢复原布局，父页面会把模式也回滚
                    try {
                        applyNdsLayoutVariables(previous);
                    } catch {
                        // 恢复失败也只能返回失败
                    }
                    applyNdsMask();
                    setupNdsSideScreen();
                    return {
                        ok: false,
                        needsRestart: true,
                        message: "当前内核需要重新进入游戏后才能切换屏幕布局。",
                        videoInfo: window.__ejsRpc.videoInfo,
                    };
                },

                /**
                 * 切滤镜（父页面标题栏的滤镜选择器）：先按 reset 把上一次用过的内核选项复位
                 * （各内核的关闭值不一样——mGBA 是 OFF、其余是 disabled，所以由父页面的滤镜表
                 * 逐键给出，这里不猜），再下发本次的键值，最后换着色器——内核下一帧会重读可变项，
                 * 不用重启。启动那一份不走这里：由 iframe 的 copts / shader 参数在内核加载前落好。
                 */
                setFilter(payload) {
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再切换滤镜。" };
                    }
                    const options = (payload && payload.options) || {};
                    const reset = (payload && payload.reset) || {};
                    try {
                        for (const [key, off] of Object.entries(reset)) {
                            if (!(key in options)) {
                                inst.gameManager.setVariable(key, off);
                            }
                        }
                        for (const [key, value] of Object.entries(options)) {
                            inst.gameManager.setVariable(key, value);
                        }
                    } catch {
                        return { ok: false, message: "切换滤镜失败。" };
                    }
                    if (!applyShader((payload && payload.shader) || "disabled")) {
                        return { ok: false, message: "切换滤镜失败。" };
                    }
                    return { ok: true };
                },

                /**
                 * 截图：先走引擎自带截图（内核侧读帧缓冲，得到的是**原生像素**，如 FC 256×224），
                 * 拿不到或是全黑时退回拷画布（尺寸 = 画布显示尺寸）。
                 *
                 * 之所以不只用画布拷贝：引擎的 WebGL 上下文是 preserveDrawingBuffer:false（实测），
                 * 拷贝必须赶在「同一帧、合成清空缓冲之前」完成——所以 captureCanvas 里用
                 * requestAnimationFrame。Chromium 下这样可靠，但个别浏览器（iOS Safari 等）仍会
                 * 拷到已清空的缓冲，得到一张全黑图；内核侧路径不碰画布，没有这个问题。
                 * 反过来内核侧也可能在某些内核/驱动组合下返回空帧，所以两条都试、优先有画面的那张。
                 * 返回的 width/height 是 PNG 的真实像素尺寸，父页面提示直接用。
                 */
                async screenshot() {
                    if (!window.EJS_emulator || !window.__ejsReady) {
                        return { ok: false, message: "模拟器尚未就绪。" };
                    }
                    const inst = window.EJS_emulator;
                    if (!inst.started) {
                        return { ok: false, message: "请先开始游戏再截图。" };
                    }
                    const core = await captureCoreFrame(inst);
                    if (core && !(await isBlankFrame(core))) {
                        return toShot(core);
                    }
                    const canvas = await captureCanvasFrame(inst);
                    if (canvas && !(await isBlankFrame(canvas))) {
                        return toShot(canvas);
                    }
                    const frame = core || canvas;
                    return frame ? toShot(frame) : { ok: false, message: "当前没有可截取的画面。" };
                },
            };

            // ---------- 底部控制条显隐接管 ----------
            // 引擎默认“点到画面才出现、闲置很久才收起、悬停其上也会自动收起”，体验拖沓。
            // 这里接管为：**只有指针滑到画面底边（90px 感应带内）才浮出**，离开即收起；
            // 指针落在控制条/其弹层上时既不自动收也不因点按关闭。
            // 点按画面不再唤出控制条——左键在游戏里是操作，不该冒出模拟器的按钮；
            // 已经浮出时点一下画面则立即收起，免得挡着画面。
            const CTRL_EDGE_ZONE = 90; // 底部感应带高度（px）
            let ctrlInited = false;
            let ctrlHideTimer = null;

            function ctrlClearTimer() {
                if (ctrlHideTimer) {
                    window.clearTimeout(ctrlHideTimer);
                    ctrlHideTimer = null;
                }
            }

            function ctrlShow(bar) {
                ctrlClearTimer();
                bar.classList.remove("x-ctrl-hide");
                bar.classList.add("x-ctrl-show");
            }

            function ctrlHideSoon(bar, delay = 600) {
                ctrlClearTimer();
                ctrlHideTimer = window.setTimeout(() => {
                    bar.classList.remove("x-ctrl-show");
                    bar.classList.add("x-ctrl-hide");
                }, delay);
            }

            // 可能是引擎自身的浮层（设置/右键菜单/状态提示等），点它们不应触发显隐切换
            function ctrlInChrome(target) {
                const CHROME = ".ejs_menu_bar, .ejs_contextmenu, .ejs_contextMenu, .ejs_menu, .ejs_settings_parent, .ejs_settings, .ejs_statePopupPanel, .ejs_state_popup";
                return target && typeof target.closest === "function" && target.closest(CHROME);
            }

            function initControlBar() {
                if (ctrlInited) {
                    return;
                }
                const bar = document.querySelector("#ejs .ejs_menu_bar");
                if (!bar) {
                    // 引擎界面还没构建完，稍后再试
                    window.setTimeout(initControlBar, 300);
                    return;
                }
                ctrlInited = true;
                const root = document.getElementById("ejs");

                function nearBottom(event) {
                    // 只有贴着画面底边的那条窄带才算“靠近控制条”：在画面中间怎么点、怎么拖
                    // 都不会把它惊动出来
                    return event.clientY >= window.innerHeight - CTRL_EDGE_ZONE;
                }

                bar.classList.add("x-ctrl-hide");
                bar.addEventListener("pointermove", () => ctrlShow(bar));
                bar.addEventListener("pointerdown", () => ctrlShow(bar));

                if (root) {
                    // 指针在控制条/浮层上：保持显示；在画面底边：浮出；否则延迟收起。
                    root.addEventListener("pointermove", (event) => {
                        if (ctrlInChrome(event.target)) {
                            ctrlShow(bar);
                        } else if (nearBottom(event)) {
                            ctrlShow(bar);
                        } else {
                            ctrlHideSoon(bar);
                        }
                    });
                    root.addEventListener("pointerleave", () => {
                        if (!ctrlInChrome(event.relatedTarget)) {
                            ctrlHideSoon(bar, 350);
                        }
                    });
                }

                // 点按画面空白：只负责收起（已经浮出时立即收起），**绝不唤出**；点在控制条/浮层上不算。
                document.addEventListener(
                    "pointerdown",
                    (event) => {
                        const target = event.target;
                        if (!target || !(target instanceof Node) || !(document.getElementById("ejs").contains(target))) {
                            return;
                        }
                        if (ctrlInChrome(target)) {
                            ctrlShow(bar);
                            return;
                        }
                        if (bar.classList.contains("x-ctrl-show")) {
                            ctrlClearTimer();
                            bar.classList.remove("x-ctrl-show");
                            bar.classList.add("x-ctrl-hide");
                        }
                    },
                    true,
                );
            }

            function start() {
                window.EJS_player = "#ejs";
                window.EJS_core = core;
                // ROM 直连后端流式接口；带版本参数使重传本体后 EmulatorJS 缓存可失效
                const romUrl = `/api/games/${encodeURIComponent(id)}/play` + (version ? `?v=${encodeURIComponent(version)}` : "");
                window.EJS_gameUrl = romUrl;
                window.EJS_pathtodata = "/emulatorjs/data/";
                window.EJS_gameID = String(id);
                window.EJS_gameName = name;
                window.EJS_threads = false;
                // 固定中文界面：loader 会按浏览器语言自动请求 localization/<locale>.json，
                // 若不由我们固定会去外找不存在的文件（404）。本文件即 fetch:emulatorjs 构建期
                // 由官方 en-US + zh-CN 合成发布的“完整中文包”。
                window.EJS_language = "zh-CN";
                // 免去「开始游戏」点按：引擎就绪后自动启动游戏本体
                window.EJS_startOnLoaded = true;
                // 引擎“保存/读取状态”写入浏览器（IndexedDB），作为云存档捕捉/放回的中转。
                // 滤镜的内核选项也一并给：它们会在内核加载前写进内核设置文件、内核启动时按它
                // 初始化，比起来之后再改可靠（运行中切换见 __ejsRpc.setFilter）。
                window.EJS_defaultOptions = {
                    "save-state-location": "browser",
                    ...filterOptions,
                };
                // FC（系统名 nes → fceumm 内核）的内核选项默认值，两种显示比例各一套：
                //   pp（像素完美）：裁掉上下各 8 行过扫描（内核默认就是 8）→ 帧缓冲 256×224，
                //     按 PP（Pixel Perfect，1:1 方像素）摆放的比例就是 8:7 = 256×224；
                //   wide（4:3，真机 CRT 观感）：**不裁过扫描**→ 帧缓冲 256×240，按 4:3 摆放正好
                //     铺满 4:3 的电视屏幕（224 行按内核的 4:3 摆放会算成 ≈1.43，屏里会留黑边）。
                // 两套各对应一张电视机壳素材的屏幕洞（见 emulator-player.vue 的 SHELLS），
                // 模式由父页面经 ?ratio= 传进来，运行中切换走 __ejsRpc.setDisplayMode。
                if (core === "nes") {
                    window.EJS_defaultOptions.fceumm_aspect = wide ? "4:3" : "PP";
                    window.EJS_defaultOptions.fceumm_overscan_v_top = wide ? "0" : "8";
                    window.EJS_defaultOptions.fceumm_overscan_v_bottom = wide ? "0" : "8";
                }
                // NDS（melonDS）：BIOS 由引擎解压到虚拟文件系统；屏幕布局由父页面 ?nds= 决定
                // （dual / top / side，见上面的 NDS_LAYOUTS）。布局的两项内核选项从引擎设置
                // 菜单里隐藏——布局只能由父页面 - / = / setNdsLayout 控制，避免用户从菜单
                // 改出与机壳、遮罩不一致的几何。父页面写云端设置前也会剔除这两个键。
                if (core === "nds") {
                    window.EJS_biosUrl = NDS_BIOS_URL;
                    window.EJS_hideSettings = [
                        "melonds_screen_layout",
                        "melonds_screen_gap",
                    ];
                    window.EJS_defaultOptions.melonds_screen_layout = NDS_LAYOUTS[ndsMode].layout;
                    window.EJS_defaultOptions.melonds_screen_gap = NDS_LAYOUTS[ndsMode].gap;
                }
                // 引擎开始运行后标记就绪，并接管底部控制条显隐
                window.EJS_onGameStart = () => {
                    window.__ejsReady = true;
                    // 兜底：引擎自己写回的旧值若把布局带偏，就在这次启动后再强制一次。
                    // 个别内核没有 setVariable，或这一项要重启才生效——失败了也不能挡住
                    // 后面的 initControlBar，所以整段包在 try 里。
                    if (core === "nds") {
                        try {
                            applyNdsLayoutVariables(ndsMode);
                        } catch {
                            // 以启动前的 EJS_defaultOptions 为准
                        }
                        // 画布与机壳的「上/下层」关系：透明类 + 遮罩晚一拍再挂，
                        // 加载阶段的 UI 仍然压在黑底上，不会提前透出机壳。
                        document.documentElement.classList.add("x-nds-passthrough");
                        window.requestAnimationFrame(applyNdsMask);
                        window.setTimeout(applyNdsMask, 300);
                        window.requestAnimationFrame(setupNdsSideScreen);
                        window.setTimeout(setupNdsSideScreen, 300);
                    }
                    // 着色器不是内核选项，得等引擎起来后显式启用（此时内核与虚拟文件系统都就绪）
                    applyShader(filterShader);
                    initControlBar();
                };

                statusEl.style.display = "none"; // 引擎容器 #ejs 常驻可见（样式表），只撤掉遮罩层

                const script = document.createElement("script");
                script.src = "/emulatorjs/data/loader.js";
                script.onerror = () =>
                    showError("模拟器加载失败：引擎文件不完整，请重新运行 npm run fetch:emulatorjs。");
                document.body.appendChild(script);
            }

            // 引擎与（NDS 的）BIOS 就绪检查；缺失时给出可执行的修复提示而非白屏
            async function preflight() {
                const loaderOk = await fetch("/emulatorjs/data/loader.js", { method: "HEAD" })
                    .then((response) => response.ok)
                    .catch(() => false);
                if (!loaderOk) {
                    showError("模拟器引擎缺失：请先运行 npm run fetch:emulatorjs（Docker 镜像会自动拉取）后重试。");
                    return false;
                }
                if (core === "nds") {
                    const biosOk = await fetch(NDS_BIOS_URL, { method: "HEAD" })
                        .then((response) => response.ok)
                        .catch(() => false);
                    if (!biosOk) {
                        showError(
                            "NDS BIOS 缺失：请把 bios7.bin、bios9.bin、firmware.bin 打包成 nds.zip，" +
                                "放到 frontend/public/emulatorjs/bios/（Docker 需重建 web 镜像；" +
                                "Windows 包放到 web/emulatorjs/bios/）后重试。",
                        );
                        return false;
                    }
                }
                return true;
            }

            preflight().then((ready) => {
                if (ready) {
                    start();
                }
            });
        })();
    </script>
</body>
</html>
